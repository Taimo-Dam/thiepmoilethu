<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thiệp Mời Sinh Nhật</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ==========================================
       1. VARIABLES & RESET
       ========================================== */
    :root {
      --bg-color: #fefae0;
      --envelope-bg: #dda15e;
      --envelope-dark: #a35d20;
      --flap-color: #bc6c25;
      --card-bg: #ffffff;
      --text-main: #283618;
      --accent-color: #bc6c25;
      
      /* Dynamic Sizing */
      --env-width: clamp(280px, 85vw, 420px);
      --env-height: clamp(182px, 55.25vw, 273px);
      --border-horizontal: clamp(140px, 42.5vw, 210px);
      --border-bottom: clamp(118px, 35.91vw, 177px);
      --border-top: clamp(100px, 30.4vw, 150px);
      --card-translate-y: clamp(-150px, -30.4vw, -100px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #fefae0 0%, #faedcd 100%);
      font-family: 'Quicksand', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      padding: 20px 10px;
    }

    .background-video {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    @media (orientation: portrait) {
      .background-video {
        object-position: 50% 38%;
      }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(254, 250, 224, 0.58);
      pointer-events: none;
    }

    .instruction {
      margin-bottom: 25px;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 0.5px;
      animation: pulse 2s infinite;
      text-align: center;
    }

    /* ==========================================
       2. ENVELOPE STRUCTURE
       ========================================== */
    .envelope-wrapper {
      position: relative;
      width: var(--env-width);
      height: var(--env-height);
      background-color: var(--envelope-bg);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    .envelope-wrapper:hover {
      transform: translateY(-4px);
    }

    /* Envelope Pocket Base */
    .pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: var(--border-horizontal) solid var(--envelope-bg);
      border-right: var(--border-horizontal) solid var(--envelope-bg);
      border-bottom: var(--border-bottom) solid #d4934b;
      border-top: var(--border-top) solid transparent;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 3;
    }

    /* Envelope Top Flap */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: var(--border-horizontal) solid transparent;
      border-right: var(--border-horizontal) solid transparent;
      border-top: var(--border-top) solid var(--flap-color);
      transform-origin: top;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), border-top-color 0.4s ease;
      z-index: 4;
    }

    /* Sticker Seal */
    .sticker {
      position: absolute;
      top: calc(var(--border-top) * 0.5);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 42px;
      height: 42px;
      background: #dda15e;
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      z-index: 5;
      transition: opacity 0.3s ease, transform 0.4s ease;
    }

    .sticker::after {
      content: '✉';
      font-size: 20px;
      color: #fff;
    }

    /* ==========================================
       3. CARD INSIDE
       ========================================== */
    .card {
      position: absolute;
      bottom: 10px;
      left: 5%;
      width: 90%;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 20px 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      z-index: 2;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.6s step-end;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #f3e9dc;
      transform: translateY(100%);
    }

    .card > * {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card h2 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      color: var(--accent-color);
      line-height: 1.2;
    }

    .card p.sub {
      font-size: 0.85rem;
      color: #666;
      font-weight: 500;
    }

    .card .details {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #333;
      margin: 4px 0;
    }

    .card .details strong {
      color: var(--accent-color);
    }

    /* Countdown Timer */
    .countdown-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .time-box {
      background: #fefae0;
      padding: 6px 8px;
      border-radius: 6px;
      min-width: 45px;
      border: 1px solid #faedcd;
    }

    .time-box span {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .time-box label {
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
    }

    /* ==========================================
       4. OPEN STATE ANIMATIONS
       ========================================== */
    .envelope-wrapper.open .flap {
      transform: rotateX(180deg);
      border-top-color: var(--envelope-dark);
      z-index: 1;
    }

    .envelope-wrapper.open {
      overflow: visible;
    }

    .envelope-wrapper.open .sticker {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
    }

    .envelope-wrapper.open .card {
      transform: translateY(var(--card-translate-y));
      z-index: 5;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1) 0.3s, z-index 0.1s step-start 1s;
    }

    .envelope-wrapper.open .card > * {
      opacity: 1;
      transition-delay: 1s;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="68367-865432244.mp4" type="video/mp4" />
  </video>

  <div class="instruction">✨ Nhấp vào phong bì để mở thiệp ✨</div>

  <!-- Phong bì -->
  <div class="envelope-wrapper" id="envelope">
    <div class="flap"></div>
    <div class="sticker"></div>
    
    <!-- Tấm thiệp bên trong -->
    <div class="card" id="card">
      <h2>Mời Bạn Đến Dự Sinh Nhật!</h2>
      <p class="sub">Sự hiện diện của bạn là niềm niềm vui lớn nhất!</p>
      
      <div class="details">
        <p>📅 <strong>Thời gian:</strong> 19:30 - Ngày 11/10/2026</p>
        <p>📍 <strong>Địa điểm:</strong> Hẻm 15, TP. Quy Nhơn</p>
      </div>

      <!-- Đếm ngược -->
      <div class="countdown-container" id="countdown">
        <div class="time-box"><span id="days">00</span><label>Ngày</label></div>
        <div class="time-box"><span id="hours">00</span><label>Giờ</label></div>
        <div class="time-box"><span id="minutes">00</span><label>Phút</label></div>
        <div class="time-box"><span id="seconds">00</span><label>Giây</label></div>
      </div>
    </div>

    <div class="pocket"></div>
  </div>

  <!-- JavaScript logic -->
  <script>
    const envelope = document.getElementById('envelope');
    const card = document.getElementById('card');

    // Preload file âm thanh mở thiệp (thay bằng URL audio thật của bạn nếu có)
    const openAudio = new Audio('./Áo Mới Cà Mau - Dương Hồng Loan - Bolero Trữ Tình.mp3');
    openAudio.preload = 'auto';

    // Hiệu ứng pháo hoa
    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // Sự kiện mở/đóng phong bì
    envelope.addEventListener('click', () => {
      const isOpen = envelope.classList.toggle('open');
      if (isOpen) {
        openAudio.currentTime = 0;
        openAudio.play().catch(() => {}); // Tránh lỗi autoplay trên di động
        setTimeout(triggerConfetti, 350);
      }
    });

    // Chống đóng thiệp khi người dùng chạm vào đọc nội dung bên trong
    card.addEventListener('click', (e) => {
      if (envelope.classList.contains('open')) {
        e.stopPropagation();
      }
    });

    // Logic đếm ngược đến sự kiện
    const eventDate = new Date('2026-10-11T19:30:00').getTime();

    function updateCountdown() {
      const now = Date.now();
      const distance = eventDate - now;

      if (distance < 0) {
        document.getElementById('countdown').innerHTML = 
          "<p style='color:#bc6c25; font-weight:bold; font-size:0.85rem;'>🎉 Sự kiện đang diễn ra!</p>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
